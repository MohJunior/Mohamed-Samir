<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morning Noor ☀️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      cursor: none;
      user-select: none;
      background: linear-gradient(to bottom, #020218, #0d0535, #1a0a4a);
      transition: background 1.5s ease;
    }
    body.twilight { background: linear-gradient(to bottom, #1a0a4a, #4a1560, #8b2252, #d4416c); }
    body.dawn     { background: linear-gradient(to bottom, #4a1560, #c2185b, #ff7043, #ffc107); }
    body.morning  { background: linear-gradient(135deg, #fff9c4 0%, #ffecd2 50%, #ffe0b2 100%); }

    /* ── cursor ── */
    #cursor {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.55);
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      mix-blend-mode: screen;
    }

    /* ── moon ── */
    .moon {
      position: fixed;
      top: 1.8rem; right: 2.2rem;
      font-size: 3rem;
      pointer-events: none;
      animation: moonGlow 3s ease-in-out infinite alternate;
      transition: opacity 1s ease;
      z-index: 2;
    }
    @keyframes moonGlow {
      from { filter: drop-shadow(0 0 10px rgba(200,200,255,.4)); }
      to   { filter: drop-shadow(0 0 26px rgba(200,200,255,.9)); }
    }

    /* ════════════════════════════════════════
       PHASE 1 — STAR GAME
    ════════════════════════════════════════ */
    #gameScreen {
      position: fixed; inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity .8s ease;
    }
    #gameScreen.hide { opacity: 0; pointer-events: none; }

    .game-header {
      padding: 2.5rem 1rem 1.2rem;
      text-align: center;
    }
    .game-header h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #ffd54f;
      text-shadow: 0 0 20px rgba(255,213,79,.55);
    }
    .game-header p {
      font-size: .85rem;
      color: #b39ddb;
      margin-top: .35rem;
      font-weight: 500;
    }

    .score-wrap {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-top: .9rem;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,215,0,.2);
      border-radius: 50px;
      padding: .45rem 1.1rem;
    }
    .score-stars { display: flex; gap: 3px; }
    .s-pip {
      font-size: .95rem;
      filter: grayscale(1) opacity(.2);
      transition: filter .3s, transform .3s;
    }
    .s-pip.lit { filter: none; transform: scale(1.25); }
    .score-label {
      font-size: .82rem;
      font-weight: 700;
      color: #ffd54f;
      margin-left: .3rem;
    }

    /* star area */
    #gameArea {
      position: relative;
      flex: 1;
      width: 100%;
    }

    .star-item {
      position: absolute;
      cursor: pointer;
      animation: starTwinkle ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(255,215,0,.6));
      transition: transform .1s;
      touch-action: manipulation;
      line-height: 1;
    }
    .star-item:hover  { transform: scale(1.35) !important; }
    .star-item:active { transform: scale(.9)   !important; }

    @keyframes starTwinkle {
      from { opacity: .55; filter: drop-shadow(0 0 5px rgba(255,215,0,.3)); }
      to   { opacity: 1;   filter: drop-shadow(0 0 18px rgba(255,215,0,.9)); }
    }

    .star-item.collected {
      animation: starPop .38s ease-out forwards !important;
      pointer-events: none;
    }
    @keyframes starPop {
      0%   { transform: scale(1);   opacity: 1; }
      45%  { transform: scale(2.3); opacity: .85; }
      100% { transform: scale(0);   opacity: 0; }
    }

    /* ── SUNRISE SCREEN ── */
    #sunriseScreen {
      display: none;
      position: fixed; inset: 0;
      z-index: 7;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    #sunriseScreen.show { display: flex; animation: ssFade .6s ease; }
    @keyframes ssFade {
      from { opacity: 0; } to { opacity: 1; }
    }

    .rise-sun {
      font-size: 7rem;
      animation: sunRise 2s cubic-bezier(.34,1.2,.64,1) forwards;
      filter: drop-shadow(0 0 40px rgba(255,200,0,.9));
    }
    @keyframes sunRise {
      0%   { transform: translateY(90px) scale(.4);  opacity: 0; }
      60%  { transform: translateY(-12px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0) scale(1);       opacity: 1; }
    }

    .rise-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #fff;
      text-shadow: 0 2px 24px rgba(255,150,0,.7);
      animation: ssFade .8s ease .7s both;
    }

    /* ════════════════════════════════════════
       PHASE 2 — LOVE CARD
    ════════════════════════════════════════ */
    #loveScreen {
      position: fixed; inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      opacity: 0;
      pointer-events: none;
      overflow-y: auto;
      transition: opacity .8s ease;
    }
    #loveScreen.show { opacity: 1; pointer-events: all; }

    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(255,152,0,.2), 0 2px 10px rgba(255,152,0,.1);
      border: 2px solid rgba(255,204,0,.4);
    }

    .stars-row {
      font-size: 1.1rem;
      letter-spacing: .35rem;
      color: #f57c00;
      margin-bottom: .5rem;
      animation: tw 2s ease-in-out infinite alternate;
    }
    @keyframes tw {
      from { opacity: .45; } to { opacity: 1; }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      color: #e65100;
      line-height: 1.1;
      margin-bottom: .4rem;
    }
    .subtitle {
      font-size: .9rem;
      color: #bf360c;
      font-weight: 500;
      margin-bottom: 2rem;
      opacity: .8;
    }

    #mainSun {
      display: inline-block;
      font-size: 5.5rem;
      cursor: pointer;
      animation: sunSpin 4s linear infinite;
      filter: drop-shadow(0 4px 20px rgba(255,152,0,.5));
    }
    #mainSun:hover  { animation: none; transform: scale(1.2); }
    #mainSun:active { transform: scale(.9); }
    @keyframes sunSpin {
      0%   { transform: scale(1)    rotate(0deg);  }
      50%  { transform: scale(1.08) rotate(180deg); }
      100% { transform: scale(1)    rotate(360deg); }
    }

    .tap-hint {
      font-size: .8rem;
      color: #bf5000;
      margin-top: .4rem;
      animation: nudge 2s ease-in-out infinite;
    }
    @keyframes nudge {
      0%,100% { transform: translateY(0);   }
      50%     { transform: translateY(-5px); }
    }
    #tapCounter {
      min-height: 1.4rem;
      font-size: .82rem;
      color: #e65100;
      font-weight: 600;
      margin-top: .25rem;
    }

    #msgSection { display: none; margin-top: 1.8rem; }
    #msgSection.show { display: block; animation: fadeUp .8s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .divider { border: none; border-top: 2px dashed #ffe0b2; margin: 1.4rem 0; }

    #msgText {
      font-family: 'Dancing Script', cursive;
      font-size: 1.45rem;
      color: #bf360c;
      line-height: 1.9;
      white-space: pre-wrap;
      min-height: 4rem;
    }

    .reasons-title {
      font-size: .82rem;
      font-weight: 700;
      color: #e65100;
      letter-spacing: .12rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .reasons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .r-card {
      background: linear-gradient(135deg, #fff8e1, #fff3cd);
      border: 1px solid #ffe082;
      border-radius: 16px;
      padding: .85rem .7rem;
      font-size: .82rem;
      color: #e65100;
      font-weight: 600;
      opacity: 0;
      transform: scale(.75) translateY(10px);
      transition: opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .r-card.pop { opacity: 1; transform: scale(1) translateY(0); }
    .r-card:hover { transform: scale(1.06); cursor: default; box-shadow: 0 4px 16px rgba(255,152,0,.18); }
    .r-emoji { font-size: 1.6rem; display: block; margin-bottom: .3rem; }

    /* burst */
    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      animation: burstOut 1.3s ease-out forwards;
    }
    @keyframes burstOut {
      0%   { opacity: 1; transform: translateY(0)     scale(1)  rotate(0deg);   }
      100% { opacity: 0; transform: translateY(-140px) scale(.3) rotate(320deg); }
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.4rem 2rem; }
      #mainSun { font-size: 4.2rem; }
      .reasons-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div class="moon">🌙</div>

  <!-- Phase 1: Star game -->
  <div id="gameScreen">
    <div class="game-header">
      <h2>Collect the stars! ✨</h2>
      <p>tap them all to bring the morning…</p>
      <div class="score-wrap">
        <div class="score-stars" id="scorePips"></div>
        <span class="score-label" id="scoreLabel">0 / 12</span>
      </div>
    </div>
    <div id="gameArea"></div>
  </div>

  <!-- Phase 2: Sunrise -->
  <div id="sunriseScreen">
    <div class="rise-sun">☀️</div>
    <div class="rise-text">Good morning, Noor! 🌸</div>
  </div>

  <!-- Phase 3: Love card -->
  <div id="loveScreen">
    <div class="card">
      <div class="stars-row">✦ ✦ ✦</div>
      <h1>Good morning Noor ☀️</h1>
      <p class="subtitle">I hope your day is as bright as you are</p>

      <div id="mainSun">☀️</div>
      <p class="tap-hint">tap the sun ↑</p>
      <p id="tapCounter"></p>

      <div id="msgSection">
        <hr class="divider">
        <p id="msgText"></p>
        <hr class="divider">
        <p class="reasons-title">things I love about your mornings</p>
        <div class="reasons-grid" id="reasonsGrid"></div>
      </div>
    </div>
  </div>

  <script>
    /* ── cursor ── */
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    /* ── sparkle trail ── */
    const SPARKS = ['✨','⭐','🌟','💛'];
    document.addEventListener('mousemove', e => {
      if (Math.random() > .85) spawnTrail(e.clientX, e.clientY);
    });
    function spawnTrail(x, y) {
      const el = document.createElement('div');
      el.className   = 'burst';
      el.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
      el.style.left  = x + 'px';
      el.style.top   = y + 'px';
      el.style.fontSize = '.8rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    /* ═══════════════════ STAR GAME ═══════════════════ */
    const TARGET    = 12;
    const STAR_EMO  = ['⭐','✨','🌟','💫'];
    let   collected = 0;
    let   gameActive = true;

    const gameArea   = document.getElementById('gameArea');
    const scorePips  = document.getElementById('scorePips');
    const scoreLabel = document.getElementById('scoreLabel');

    /* pip row */
    for (let i = 0; i < TARGET; i++) {
      const s = document.createElement('span');
      s.className = 's-pip';
      s.id = 'sp' + i;
      s.textContent = '⭐';
      scorePips.appendChild(s);
    }

    /* place stars at non-overlapping random positions */
    const placed = [];
    for (let i = 0; i < TARGET; i++) {
      let x, y, tries = 0, ok;
      do {
        x = Math.random() * 76 + 8;   // 8–84%
        y = Math.random() * 58 + 14;  // 14–72%
        ok = placed.every(p => Math.hypot(p.x - x, p.y - y) > 13);
        tries++;
      } while (!ok && tries < 60);
      placed.push({ x, y });

      const el = document.createElement('div');
      el.className   = 'star-item';
      el.textContent = STAR_EMO[i % STAR_EMO.length];
      el.style.left  = x + '%';
      el.style.top   = y + '%';
      el.style.fontSize = (Math.random() * 1.2 + 2) + 'rem';
      el.style.animationDuration = (Math.random() * 1.2 + 1.1) + 's';
      el.style.animationDelay   = (Math.random() * 2) + 's';

      function grab(e, node) {
        if (!gameActive || node.dataset.done) return;
        e.stopPropagation();
        node.dataset.done = '1';
        node.classList.add('collected');

        collected++;
        const pip = document.getElementById('sp' + (collected - 1));
        if (pip) pip.classList.add('lit');
        scoreLabel.textContent = collected + ' / ' + TARGET;

        if (collected === 4) document.body.className = 'twilight';
        if (collected === 8) document.body.className = 'dawn';

        const rect = node.getBoundingClientRect();
        burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2, ['✨','🌟','💛','⭐','💫']);

        setTimeout(() => node.remove(), 400);
        if (collected >= TARGET) winGame();
      }

      el.addEventListener('click', e => grab(e, el));
      el.addEventListener('touchstart', e => { e.preventDefault(); grab(e, el); }, { passive: false });
      gameArea.appendChild(el);
    }

    function winGame() {
      gameActive = false;
      document.getElementById('gameScreen').classList.add('hide');
      document.querySelector('.moon').style.opacity = '0';

      for (let i = 0; i < 28; i++) {
        setTimeout(() => burstAt(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight * .7,
          ['✨','🌟','☀️','💛','🌸','⭐']
        ), i * 65);
      }

      const sr = document.getElementById('sunriseScreen');
      setTimeout(() => {
        sr.classList.add('show');
        document.body.className = 'morning';
      }, 350);

      setTimeout(() => {
        sr.style.opacity    = '0';
        sr.style.transition = 'opacity .7s';
        setTimeout(() => {
          sr.style.display = 'none';
          document.getElementById('loveScreen').classList.add('show');
          document.body.style.overflowY = 'auto';
        }, 750);
      }, 2900);
    }

    /* ═══════════════════ LOVE CARD ═══════════════════ */
    let taps = 0, revealed = false;

    const MESSAGE =
      "Good morning, Noor. ☀️\n\n" +
      "You're the first thought on my mind\n" +
      "every single morning.\n\n" +
      "I love you so much. 💛";

    const REASONS = [
      { e: '😴', t: 'Your sleepy voice'        },
      { e: '☕', t: 'Morning coffee with you'  },
      { e: '😊', t: 'Your morning smile'       },
      { e: '🥱', t: 'Your cute yawns'          },
      { e: '💌', t: 'Your good morning texts'  },
      { e: '🌅', t: 'Every sunrise with you'   },
    ];

    const TAPS = [
      'have the best day ever 🌸',
      "you're my sunshine ☀️",
      'thinking of you all day 💛',
      'I love you, I love you, I love you 💛',
      'seriously go have a great day 🌸',
    ];

    const sunEl   = document.getElementById('mainSun');
    const section = document.getElementById('msgSection');
    const msgEl   = document.getElementById('msgText');
    const counter = document.getElementById('tapCounter');
    const grid    = document.getElementById('reasonsGrid');

    function onSunClick() {
      taps++;
      const rect = sunEl.getBoundingClientRect();
      burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2, ['☀️','✨','💛','🌸','⭐']);

      if (!revealed) {
        revealed = true;
        sunEl.style.animation = 'none';
        section.classList.add('show');

        let i = 0;
        msgEl.textContent = '';
        function tick() {
          if (i < MESSAGE.length) { msgEl.textContent += MESSAGE[i++]; setTimeout(tick, 32); }
          else {
            REASONS.forEach((r, idx) => {
              const c = document.createElement('div');
              c.className = 'r-card';
              c.innerHTML = `<span class="r-emoji">${r.e}</span>${r.t}`;
              grid.appendChild(c);
              setTimeout(() => c.classList.add('pop'), idx * 150 + 150);
            });
          }
        }
        tick();
      } else {
        counter.textContent = TAPS[(taps - 2) % TAPS.length];
        sunEl.style.transform = 'scale(1.3) rotate(25deg)';
        setTimeout(() => sunEl.style.transform = '', 260);
      }
    }

    sunEl.addEventListener('click', onSunClick);
    sunEl.addEventListener('touchstart', e => { e.preventDefault(); onSunClick(); }, { passive: false });

    /* ── burst helper ── */
    function burstAt(x, y, pool) {
      for (let i = 0; i < 7; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className   = 'burst';
          el.textContent = pool[Math.floor(Math.random() * pool.length)];
          el.style.left  = (x + (Math.random() - .5) * 90) + 'px';
          el.style.top   = (y + (Math.random() - .5) * 50) + 'px';
          el.style.fontSize = (Math.random() * .8 + .9) + 'rem';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1400);
        }, i * 50);
      }
    }
  </script>
</body>
</html>
