<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hey Noor 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 45%, #ffecd2 100%);
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      cursor: none;
      user-select: none;
    }

    /* ── Custom cursor ── */
    #cursor {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(214, 51, 132, 0.5);
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      mix-blend-mode: multiply;
    }

    /* ── Floating BG hearts ── */
    #heartsBg {
      position: fixed; inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-heart {
      position: absolute;
      bottom: -60px;
      opacity: .65;
      animation: bgFloat linear infinite;
    }
    @keyframes bgFloat {
      0%   { transform: translateY(0) rotate(0deg);   opacity: .65; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    /* ════════════════════════════════════════
       PHASE 1 — MINI GAME
    ════════════════════════════════════════ */
    #gameScreen {
      position: fixed; inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity .8s ease;
    }
    #gameScreen.hide { opacity: 0; pointer-events: none; }

    .game-header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }
    .game-header h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3rem);
      color: #c2185b;
      text-shadow: 0 2px 12px rgba(194,24,91,.2);
    }
    .game-header p {
      font-size: .85rem;
      color: #a0527a;
      margin-top: .3rem;
      font-weight: 500;
    }

    /* Score bar */
    .score-wrap {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-top: .8rem;
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      padding: .45rem 1.2rem;
      box-shadow: 0 4px 16px rgba(214,51,132,.15);
    }
    .score-hearts {
      display: flex; gap: 3px;
    }
    .score-pip {
      font-size: 1.1rem;
      filter: grayscale(1) opacity(.3);
      transition: filter .3s, transform .3s;
    }
    .score-pip.filled {
      filter: none;
      transform: scale(1.15);
    }
    .score-text {
      font-size: .85rem;
      font-weight: 700;
      color: #c2185b;
      margin-left: .4rem;
    }

    /* Falling hearts area */
    #gameArea {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .fall-heart {
      position: absolute;
      top: -70px;
      cursor: pointer;
      animation: fallDown linear forwards;
      filter: drop-shadow(0 3px 10px rgba(214,51,132,.35));
      transition: transform .08s;
    }
    .fall-heart:hover  { transform: scale(1.25); }
    .fall-heart:active { transform: scale(.9);   }

    @keyframes fallDown {
      from { top: -70px; }
      to   { top: 110%;  }
    }

    /* Caught pop */
    .fall-heart.caught {
      animation: caughtPop .35s ease-out forwards !important;
      pointer-events: none;
    }
    @keyframes caughtPop {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(2);   opacity: .8; }
      100% { transform: scale(0);   opacity: 0; }
    }

    /* ── Win banner ── */
    #winBanner {
      display: none;
      position: fixed; inset: 0;
      z-index: 6;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    #winBanner.show { display: flex; animation: fadeIn .5s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.85); }
      to   { opacity: 1; transform: scale(1);   }
    }

    .win-card {
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 2.5rem 3rem;
      text-align: center;
      box-shadow: 0 12px 40px rgba(214,51,132,.25);
      border: 2px solid rgba(255,160,180,.4);
    }
    .win-card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #c2185b;
    }
    .win-card p {
      margin-top: .5rem;
      color: #a0527a;
      font-size: .9rem;
      font-weight: 500;
    }

    /* ════════════════════════════════════════
       PHASE 2 — LOVE CARD
    ════════════════════════════════════════ */
    #loveScreen {
      position: fixed; inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      opacity: 0;
      pointer-events: none;
      overflow-y: auto;
      transition: opacity .8s ease;
    }
    #loveScreen.show {
      opacity: 1;
      pointer-events: all;
    }

    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(214,51,132,.18), 0 2px 8px rgba(214,51,132,.08);
      border: 2px solid rgba(255,160,180,.35);
    }

    .stars {
      font-size: 1.1rem;
      letter-spacing: .35rem;
      color: #e91e8c;
      margin-bottom: .5rem;
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: .45; }
      to   { opacity: 1;   }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      color: #c2185b;
      line-height: 1.1;
      margin-bottom: .4rem;
    }
    .subtitle {
      font-size: .9rem;
      color: #a0527a;
      font-weight: 500;
      margin-bottom: 2rem;
    }

    #mainHeart {
      display: inline-block;
      font-size: 5.5rem;
      cursor: pointer;
      animation: heartbeat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 4px 18px rgba(214,51,132,.45));
      transition: filter .2s;
    }
    #mainHeart:hover {
      animation: none;
      transform: scale(1.18);
      filter: drop-shadow(0 8px 28px rgba(214,51,132,.65));
    }
    #mainHeart:active { transform: scale(.92); }
    @keyframes heartbeat {
      0%,100% { transform: scale(1);    }
      14%     { transform: scale(1.18); }
      28%     { transform: scale(1);    }
      42%     { transform: scale(1.12); }
      56%     { transform: scale(1);    }
    }

    .tap-hint {
      font-size: .8rem;
      color: #b06080;
      margin-top: .4rem;
      animation: nudge 2s ease-in-out infinite;
    }
    @keyframes nudge {
      0%,100% { transform: translateY(0);   }
      50%     { transform: translateY(-5px); }
    }

    #clickCounter {
      min-height: 1.4rem;
      font-size: .82rem;
      color: #c2185b;
      font-weight: 600;
      margin-top: .25rem;
    }

    #messageSection {
      display: none;
      margin-top: 1.8rem;
    }
    #messageSection.show {
      display: block;
      animation: fadeUp .8s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .divider {
      border: none;
      border-top: 2px dashed #f8bbd0;
      margin: 1.4rem 0;
    }

    #messageText {
      font-family: 'Dancing Script', cursive;
      font-size: 1.45rem;
      color: #ad1457;
      line-height: 1.85;
      white-space: pre-wrap;
      min-height: 4rem;
    }

    .reasons-title {
      font-size: .82rem;
      font-weight: 700;
      color: #880e4f;
      letter-spacing: .12rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .reasons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
    }
    .reason-card {
      background: linear-gradient(135deg, #fff0f5, #ffe4ec);
      border: 1px solid #f8bbd0;
      border-radius: 16px;
      padding: .85rem .7rem;
      font-size: .82rem;
      color: #880e4f;
      font-weight: 600;
      opacity: 0;
      transform: scale(.75) translateY(10px);
      transition: opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .reason-card.pop {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .reason-card:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 20px rgba(255,100,130,.2);
      cursor: default;
    }
    .reason-emoji { font-size: 1.6rem; display: block; margin-bottom: .3rem; }

    /* ── Burst confetti ── */
    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      animation: burstOut 1.3s ease-out forwards;
    }
    @keyframes burstOut {
      0%   { opacity: 1; transform: translateY(0)     scale(1)  rotate(0deg);   }
      100% { opacity: 0; transform: translateY(-130px) scale(.3) rotate(330deg); }
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.4rem 2rem; }
      #mainHeart { font-size: 4.2rem; }
      .reasons-grid { grid-template-columns: 1fr; }
      .win-card { padding: 2rem 1.8rem; }
      .win-card h2 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <div id="cursor"></div>
  <div id="heartsBg"></div>

  <!-- ── Phase 1: Mini Game ── -->
  <div id="gameScreen">
    <div class="game-header">
      <h2>Catch the hearts! 💕</h2>
      <p>tap them before they fall away…</p>
      <div class="score-wrap">
        <div class="score-hearts" id="scorePips"></div>
        <span class="score-text" id="scoreText">0 / 10</span>
      </div>
    </div>
    <div id="gameArea"></div>
  </div>

  <!-- ── Win banner ── -->
  <div id="winBanner">
    <div class="win-card">
      <h2>You did it! 💖</h2>
      <p>Now here's something for Noor…</p>
    </div>
  </div>

  <!-- ── Phase 2: Love Card ── -->
  <div id="loveScreen">
    <div class="card">
      <div class="stars">✦ ✦ ✦</div>
      <h1>Hey Noor 🌸</h1>
      <p class="subtitle">I made you something special...</p>

      <div id="mainHeart">💗</div>
      <p class="tap-hint">tap the heart ↑</p>
      <p id="clickCounter"></p>

      <div id="messageSection">
        <hr class="divider">
        <p id="messageText"></p>
        <hr class="divider">
        <p class="reasons-title">reasons I miss you</p>
        <div class="reasons-grid" id="reasonsGrid"></div>
      </div>
    </div>
  </div>

  <script>
    /* ── cursor ── */
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    /* ── floating BG hearts ── */
    const bgEl   = document.getElementById('heartsBg');
    const POOL   = ['💕','💗','💖','💓','🌸','✨','💞','🌷','⭐','🌺'];

    function spawnBg() {
      const el = document.createElement('div');
      el.className = 'bg-heart';
      el.textContent = POOL[Math.floor(Math.random() * POOL.length)];
      el.style.left     = Math.random() * 100 + '%';
      el.style.fontSize = (Math.random() * 1.4 + .7) + 'rem';
      const dur = Math.random() * 9 + 7;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay   = Math.random() * 3 + 's';
      bgEl.appendChild(el);
      setTimeout(() => el.remove(), (dur + 4) * 1000);
    }
    for (let i = 0; i < 10; i++) spawnBg();
    setInterval(spawnBg, 700);

    /* ── cursor trail ── */
    document.addEventListener('mousemove', e => {
      if (Math.random() > .84) spawnTrail(e.clientX, e.clientY);
    });
    function spawnTrail(x, y) {
      const el = document.createElement('div');
      el.className  = 'burst';
      el.textContent = ['💕','✨','💗','🌸'][Math.floor(Math.random() * 4)];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.style.fontSize = '.85rem';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    /* ════════════════════════════════
       MINI GAME
    ════════════════════════════════ */
    const TARGET    = 10;
    const HEART_EMO = ['💗','💕','💖','💓','🌸'];
    let caught      = 0;
    let gameActive  = true;
    let spawnTimer;

    const gameArea   = document.getElementById('gameArea');
    const scorePips  = document.getElementById('scorePips');
    const scoreText  = document.getElementById('scoreText');

    /* Build pip hearts */
    for (let i = 0; i < TARGET; i++) {
      const pip = document.createElement('span');
      pip.className = 'score-pip';
      pip.textContent = '💗';
      pip.id = 'pip' + i;
      scorePips.appendChild(pip);
    }

    function updateScore() {
      scoreText.textContent = caught + ' / ' + TARGET;
      const pip = document.getElementById('pip' + (caught - 1));
      if (pip) pip.classList.add('filled');
    }

    function spawnFallHeart() {
      if (!gameActive) return;

      const el = document.createElement('div');
      el.className   = 'fall-heart';
      el.textContent = HEART_EMO[Math.floor(Math.random() * HEART_EMO.length)];

      const left     = Math.random() * 80 + 5;
      const size     = Math.random() * 1.2 + 2.2;
      const speed    = Math.max(1.4, 3.5 - caught * 0.18);

      el.style.cssText = `left:${left}%; font-size:${size}rem; animation-duration:${speed}s;`;

      function catchIt(e) {
        if (!gameActive || el.dataset.caught) return;
        e.stopPropagation();
        el.dataset.caught = '1';
        el.classList.add('caught');

        caught++;
        updateScore();

        const rect = el.getBoundingClientRect();
        burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2);

        setTimeout(() => el.remove(), 350);
        if (caught >= TARGET) winGame();
      }

      el.addEventListener('click',      catchIt);
      el.addEventListener('touchstart', e => { e.preventDefault(); catchIt(e); }, { passive: false });

      gameArea.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, (speed + .5) * 1000);
    }

    /* Dynamic spawn rate — starts at 1s, quickens as score rises */
    function scheduleSpawn() {
      const delay = Math.max(500, 1200 - caught * 60);
      spawnTimer = setTimeout(() => { spawnFallHeart(); scheduleSpawn(); }, delay);
    }

    /* Initial batch so screen isn't empty */
    for (let i = 0; i < 3; i++) setTimeout(spawnFallHeart, i * 350);
    scheduleSpawn();

    /* ── Win flow ── */
    function winGame() {
      gameActive = false;
      clearTimeout(spawnTimer);

      /* big burst */
      for (let i = 0; i < 30; i++) {
        setTimeout(() => burstAt(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight * .6
        ), i * 60);
      }

      /* show win banner, then transition */
      const banner = document.getElementById('winBanner');
      banner.classList.add('show');

      setTimeout(() => {
        document.getElementById('gameScreen').classList.add('hide');
        banner.style.opacity = '0';
        banner.style.transition = 'opacity .6s';

        setTimeout(() => {
          banner.style.display = 'none';
          document.getElementById('loveScreen').classList.add('show');
          document.body.style.overflowY = 'auto';
        }, 700);
      }, 2200);
    }

    /* ── Confetti burst helper ── */
    function burstAt(x, y) {
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className   = 'burst';
          el.textContent = POOL[Math.floor(Math.random() * POOL.length)];
          el.style.left  = (x + (Math.random() - .5) * 80) + 'px';
          el.style.top   = (y + (Math.random() - .5) * 40) + 'px';
          el.style.fontSize = (Math.random() * .8 + 1) + 'rem';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1400);
        }, i * 45);
      }
    }

    /* ════════════════════════════════
       LOVE CARD
    ════════════════════════════════ */
    let cardClicks = 0, revealed = false;

    const MESSAGE =
      "There are so many miles between us right now,\n" +
      "but every single moment — I think of you.\n\n" +
      "You light up my whole world, Noor. 🌟\n" +
      "Distance is just a reminder of how much\n" +
      "I can't wait to be with you again. 💌";

    const REASONS = [
      { e: '😂', t: 'Your laugh'           },
      { e: '🤗', t: 'Your hugs'            },
      { e: '👀', t: 'Your eyes'            },
      { e: '💬', t: 'Our conversations'    },
      { e: '🌸', t: 'The way you smell'    },
      { e: '🎵', t: 'Your voice'           },
      { e: '☕', t: 'Mornings with you'    },
      { e: '🌙', t: 'Your goodnight texts' },
    ];

    const TAPS = [
      'sending you so much love 💌',
      "you're literally my favorite 💕",
      'come back soon 🌸',
      'missing you more every tap 🥺',
      'seriously though… miss you 💗',
    ];

    const heartEl = document.getElementById('mainHeart');
    const section = document.getElementById('messageSection');
    const msgEl   = document.getElementById('messageText');
    const counter = document.getElementById('clickCounter');
    const grid    = document.getElementById('reasonsGrid');

    function onHeartClick() {
      cardClicks++;
      const rect = heartEl.getBoundingClientRect();
      burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2);

      if (!revealed) {
        revealed = true;
        heartEl.textContent  = '💖';
        heartEl.style.animation = 'none';
        section.classList.add('show');

        let i = 0;
        msgEl.textContent = '';
        function tick() {
          if (i < MESSAGE.length) { msgEl.textContent += MESSAGE[i++]; setTimeout(tick, 32); }
          else {
            REASONS.forEach((r, idx) => {
              const card = document.createElement('div');
              card.className = 'reason-card';
              card.innerHTML = `<span class="reason-emoji">${r.e}</span>${r.t}`;
              grid.appendChild(card);
              setTimeout(() => card.classList.add('pop'), idx * 160 + 150);
            });
          }
        }
        tick();

      } else {
        counter.textContent = TAPS[(cardClicks - 2) % TAPS.length];
        heartEl.style.transform = 'scale(1.25)';
        setTimeout(() => heartEl.style.transform = '', 220);
      }
    }

    heartEl.addEventListener('click', onHeartClick);
    heartEl.addEventListener('touchstart', e => { e.preventDefault(); onHeartClick(); }, { passive: false });
  </script>
</body>
</html>
